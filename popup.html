<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fil d'actualité</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280; --line: #e5e7eb; --chip: #f3f4f6; --accent: #111827;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181d; --fg: #f1f2f4; --muted: #9aa0ab; --line: #272a31; --chip: #232730; --accent: #f1f2f4; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 380px; max-height: 580px; display: flex; flex-direction: column;
    background: var(--bg); color: var(--fg);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px; }
  h1 { font-size: 15px; margin: 0; letter-spacing: -.01em; }
  #status { color: var(--muted); font-size: 11px; margin-top: 2px; }
  #refresh {
    border: 1px solid var(--line); background: var(--chip); color: var(--fg);
    border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 12px;
  }
  #refresh:hover { border-color: var(--muted); }
  #chips { display: flex; gap: 6px; padding: 0 14px 10px; overflow-x: auto; flex-shrink: 0; }
  .chip {
    border: 1px solid var(--line); background: var(--chip); color: var(--fg);
    border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 12px; white-space: nowrap;
  }
  .chip.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  #list { list-style: none; margin: 0; padding: 0; overflow-y: auto; border-top: 1px solid var(--line); }
  #list li { border-bottom: 1px solid var(--line); }
  #list a { display: block; padding: 10px 14px; color: inherit; text-decoration: none; }
  #list a:hover { background: var(--chip); }
  .src { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin-bottom: 3px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .t { font-weight: 500; }
  #errors { padding: 8px 14px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }
  #errors:empty { display: none; }
  .empty { padding: 24px 14px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Fil d'actualité</h1>
      <div id="status">Chargement…</div>
    </div>
    <button id="refresh" title="Actualiser">↻ Actualiser</button>
  </header>
  <div id="chips"></div>
  <ul id="list"></ul>
  <div id="errors"></div>
  <script src="popup.js"></script>
</body>
</html>
